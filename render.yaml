projects:
  - name: forma-gym-management
    environments:
      - name: production
        services:
          - type: web
            name: forma-gym-app
            runtime: node
            region: singapore
            plan: free
            buildCommand: npm ci && npm run db:generate && npm run build
            startCommand: npm run db:deploy && npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: forma-gym-db
                  property: connectionString
              - key: DATABASE_URL_UNPOOLED
                fromDatabase:
                  name: forma-gym-db
                  property: connectionString
              - fromGroup: forma-gym-secrets

        databases:
          - name: forma-gym-db
            databaseName: forma
            region: singapore
            plan: free

        envVarGroups:
          - name: forma-gym-secrets
            envVars:
              - key: CREDENTIALS_ENCRYPTION_KEY
                generateValue: true
